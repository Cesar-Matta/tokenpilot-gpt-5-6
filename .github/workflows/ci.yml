name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/run_routing_evals.py
      - run: python scripts/validate_skill.py
      - run: python scripts/public_release_check.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tokenpilot-ci .
      - run: docker run --detach --name tokenpilot-ci -p 8080:8080 tokenpilot-ci
      - run: |
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/health/live && exit 0
            sleep 1
          done
          docker logs tokenpilot-ci
          exit 1
